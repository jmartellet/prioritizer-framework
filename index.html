<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prioritizer Framework</title>

  <!-- Etapa 3: fonte Inter (Google Fonts) e o arquivo de estilo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Barra do topo -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">✧</div>
      <div>
        <strong>AI Prioritizer Framework</strong>
        <small>METODOLOGIA ESTRATÉGICA</small>
      </div>
    </div>
  </header>

  <!-- ===================== TELA 1: AVALIAÇÃO ===================== -->
  <div class="layout" id="eval-view">
    <!-- Coluna da esquerda: identificação e critérios -->
    <div class="form-col">
      <section class="card">
        <h2><span class="step">1</span>Identificação</h2>
        <label class="field">
          <span>Nome da iniciativa</span>
          <input id="name" type="text" placeholder="Ex.: Automação de fluxo de marketing">
        </label>
        <label class="field">
          <span>Descrição</span>
          <textarea id="description" rows="4" placeholder="Qual problema a iniciativa resolve e como a IA ajuda?"></textarea>
        </label>
      </section>

      <!-- O app.js desenha as dimensões aqui dentro -->
      <main id="dimensions"></main>
    </div>

    <!-- Coluna da direita: score ao vivo -->
    <aside class="side">
      <section class="card live">
        <small>LIVE SCORE</small>
        <div id="score" class="score">-</div>
        <span id="verdict" class="verdict">-</span>
        <!-- Etapa 4: botão que abre a página de resultados -->
        <button id="btn-results" class="btn-primary" type="button">Ver resultados</button>
      </section>
    </aside>
  </div>

  <!-- ===================== TELA 2: RESULTADOS (Etapa 4) ===================== -->
  <div class="results" id="results-view" hidden>
    <div class="results-header">
      <div class="logo">△</div>
      <div>
        <h1>Relatório de Priorização</h1>
        <small>INICIATIVA: <span id="result-name"></span></small>
      </div>
    </div>

    <div class="results-grid">
      <!-- Gráfico de radar -->
      <section class="card">
        <h2 class="results-title">Footprint de Valor</h2>
        <canvas id="radar"></canvas>
      </section>

      <!-- Nota final, veredito e barras -->
      <section class="card">
        <div class="card-header">
          <h2>Veredito Final</h2>
          <!-- Etapa 5: botões de exportação -->
          <div class="export-buttons">
            <button id="btn-csv" class="btn-small" type="button">CSV</button>
            <button id="btn-pdf" class="btn-small pink" type="button">PDF</button>
          </div>
        </div>
        <div class="final-box">
          <div id="result-score" class="score">-</div>
          <span id="result-verdict" class="verdict">-</span>
        </div>
        <div id="result-bars"></div>
      </section>
    </div>

    <!-- Etapa 5: texto pronto para colar no Jira -->
    <section class="card jira">
      <div class="card-header">
        <h2>Jira Cloud Export</h2>
        <button id="btn-copy" class="btn-small pink" type="button">Copiar Markdown</button>
      </div>
      <pre id="jira-text"></pre>
    </section>

    <button id="btn-back" class="btn-back" type="button">← Voltar</button>
  </div>

  <!-- Etapa 4: biblioteca de gráficos Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

  <!-- A ordem importa: critérios → app (cálculos) → resultados → exportações -->
  <script src="js/criteria.js"></script>
  <script src="js/app.js"></script>
  <script src="js/results.js"></script>
  <script src="js/export.js"></script>
</body>
</html>
